version: '3'

# Alarm calendar: pnpm monorepo (packages/core, app, electron, android).
# Data layer is Supabase (cloud), no local DB. Vite dev port 3021 is reserved
# in the root PORTS.md. Full spec: docs/spec.md.

vars:
  PORT: '3021'
  # Android: Gradle needs a JDK it supports (17 to 21). The machine default java is newer, so tasks pin 21.
  ANDROID_SDK: 'C:\Users\user\AppData\Local\Android\Sdk'
  JDK21: 'C:\Program Files\Microsoft\jdk-21.0.12.101-hotspot'
  # Pass DEVICE=<serial> (adb devices) when more than one device or emulator is attached.
  DEVICE: ''

tasks:
  install:
    desc: Install workspace dependencies
    cmds:
      - pnpm install

  test:
    desc: Run every workspace test suite (core recurrence/snooze/wallet logic)
    cmds:
      - pnpm -r test

  dev:
    desc: Run the React app in the browser on port {{.PORT}}
    cmds:
      - pnpm --filter app dev --port {{.PORT}} --strictPort

  electron:
    desc: Run the Electron app (daily dev data, %APPDATA%\alarm-calendar-dev) against the Vite dev server (starts Vite on {{.PORT}} unless it is already up)
    cmds:
      - pnpm --filter @alarm-calendar/electron dev

  electron:seed:
    desc: Same as electron, but in the separate seed folder (%APPDATA%\alarm-calendar-dev-seed) with two test alarms about 1 and 1.5 min after launch (only into an empty cache)
    env:
      ALARM_DEV_SEED: '1'
    cmds:
      - pnpm --filter @alarm-calendar/electron dev

  electron:reset:
    desc: Wipe the seed folder cache (%APPDATA%\alarm-calendar-dev-seed, never the daily dev data) and re-seed alarms about 1 and 1.5 min after launch
    env:
      ALARM_DEV_SEED: '1'
      ALARM_DEV_SEED_RESET: '1'
    cmds:
      - pnpm --filter @alarm-calendar/electron dev

  build:
    desc: Build the React app and the Electron main bundle (packaged-style, no dev server)
    cmds:
      - pnpm --filter app build
      - pnpm --filter @alarm-calendar/electron build

  electron:built:
    desc: Run Electron from the built app/dist over the app:// protocol (run build first)
    cmds:
      - pnpm --filter @alarm-calendar/electron start

  package:
    desc: Build the app, the Electron bundle and the unsigned Windows NSIS installer (electron/release/)
    cmds:
      - pnpm --filter app build
      - pnpm --filter @alarm-calendar/electron package

  android:web:
    desc: Build the React bundle for the phone into app/dist-android (never app/dist, the Electron input) and copy it into android/. Vite's mode "android" reads the real Supabase URL and key from app/.env (and an optional app/.env.android) at build time, nothing is printed
    cmds:
      - pnpm --filter app exec vite build --mode android --outDir dist-android --emptyOutDir
      - pnpm --filter app exec cap sync android

  android:test:
    desc: Run the Kotlin engine unit tests on the JVM (no device), including the shared vectors in packages/core/test-vectors/alarm-engine.json
    dir: android
    env:
      JAVA_HOME: '{{.JDK21}}'
      ANDROID_HOME: '{{.ANDROID_SDK}}'
    cmds:
      - cmd /c '.\gradlew.bat' :app:testDebugUnitTest --console=plain

  android:build:
    desc: Build the web bundle and the debug APK (android/app/build/outputs/apk/debug/app-debug.apk)
    deps: [android:web]
    dir: android
    env:
      JAVA_HOME: '{{.JDK21}}'
      ANDROID_HOME: '{{.ANDROID_SDK}}'
    cmds:
      - cmd /c '.\gradlew.bat' :app:assembleDebug --console=plain

  android:install:
    desc: Build (with the real app/.env) and install the debug APK on the connected device. With several attached (a phone and an emulator) pass DEVICE=<serial> from adb devices. HyperOS needs Developer options, Install via USB, switched on
    deps: [android:build]
    env:
      ANDROID_SERIAL: '{{.DEVICE}}'
    cmds:
      - '"{{.ANDROID_SDK}}\platform-tools\adb.exe" install -r android/app/build/outputs/apk/debug/app-debug.apk'

  android:run:
    desc: android:install, then start the app on the device (pass DEVICE=<serial> when several are attached)
    env:
      ANDROID_SERIAL: '{{.DEVICE}}'
    cmds:
      - task: android:install
      - '"{{.ANDROID_SDK}}\platform-tools\adb.exe" shell am start -n com.yassine.alarmcalendar/.MainActivity'

  android:logcat:
    desc: Follow the alarm engine log of the connected device (tag AlarmEngine plus crashes)
    env:
      ANDROID_SERIAL: '{{.DEVICE}}'
    cmds:
      - '"{{.ANDROID_SDK}}\platform-tools\adb.exe" logcat -v time AlarmEngine:I AndroidRuntime:E *:S'
